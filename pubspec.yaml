name: dating_app_verification
description: Dating app user verification flow - Flutter implementation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^17.0.1

  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.0.3
  intl_phone_field: ^3.2.0

  # Photos & Media (Module 5)
  image_picker: ^1.1.2               # Camera + gallery photo selection (front camera for selfies)
  permission_handler: ^11.3.1        # Runtime camera/storage permissions

  # Networking & infrastructure (Bundle 0 — foundation)
  dio: ^5.7.0                       # HTTP client + interceptors (error mapping, retry/backoff)
  # Note 1: env config uses --dart-define (compile-time) instead of flutter_dotenv to
  # avoid bundling secrets as assets and to respect the "never commit .env*" rule.
  # Note 2: no flutter_secure_storage — Firebase Auth persists its own session and
  # auto-refreshes ID tokens internally; manual token storage would be redundant.
  # Note 3: firebase_core / firebase_auth are deliberately NOT in this PR. They land
  # in Bundle 1 (PR #2) alongside the actual phone-OTP wiring + Firebase web config.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.7
  freezed: ^3.2.3
  json_serializable: ^6.7.1
  riverpod_generator: ^3.0.3

  # Testing
  http_mock_adapter: ^0.6.1         # Mock dio responses in unit/widget tests

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/PhonenumberIconContainer/
    - assets/images/AccountIconContainer/
    - assets/images/MailIconContainer/
    - assets/images/CompleteIconContainer/
    - assets/images/NextButton/
    - assets/images/InformationIconContainer/
    - assets/images/onboarding/AgeIcon/
    - assets/images/onboarding/GenderIcon/
    - assets/images/onboarding/PronounIcon/
    - assets/images/orientation/SexualOrientationIcon/
    - assets/images/orientation/DatingPreferenceIcon/
    - assets/images/orientation/DatingGoalIcon/
    - assets/images/orientation/
    - assets/images/background/EducationIcon/
    - assets/images/background/ProfessionIcon/
    - assets/images/background/LocationIcon/
    - assets/images/background/
    - assets/images/photos_verification/HeightIcon/
    - assets/images/photos_verification/LanguageIcon/
    - assets/images/photos_verification/PhotoIcon/
    - assets/images/photos_verification/

  # Fonts are automatically downloaded by google_fonts package
  # No manual font files needed - Playfair Display & Inter are used via GoogleFonts API
